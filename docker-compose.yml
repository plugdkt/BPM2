services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm
      POSTGRES_DB: bpm
    ports:
      - "5432:5432"
    volumes:
      - bpm_postgres_data:/var/lib/postgresql/data

volumes:
  bpm_postgres_data:
